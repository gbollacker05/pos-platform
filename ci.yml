name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend deps
        run: |
          cd payments-pos-mvp/backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run tests
        run: |
          cd payments-pos-mvp/backend
          pytest -q
      - name: Build docker images
        run: |
          cd production-bundle
          docker build ../payments-pos-mvp/backend -f ../payments-pos-mvp/backend/Dockerfile -t pos-api:ci
          docker build ../web-dashboard-mvp -f ../web-dashboard-mvp/Dockerfile -t pos-web:ci
