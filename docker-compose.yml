version: "3.9"

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pospw}
      POSTGRES_DB: ${POSTGRES_DB:-posdb}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../payments-pos-mvp/backend
      dockerfile: Dockerfile
    env_file:
      - ./env/api.env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ../web-dashboard-mvp
      dockerfile: Dockerfile
    env_file:
      - ./env/web.env
    depends_on:
      - api
    restart: unless-stopped

  proxy:
    image: nginx:1.25-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - web_build:/usr/share/nginx/html:ro
    ports:
      - "80:80"
    depends_on:
      - web
      - api
    restart: unless-stopped

volumes:
  db_data:
  web_build:
