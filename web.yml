name: CI/CD Web

on:
  push:
    branches: [ main ]
    paths:
      - "web-dashboard-mvp/**"

env:
  AWS_REGION: us-east-1
  WEB_BUCKET: pos-web-elevatedsitesolutions.com
  CLOUDFRONT_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}

jobs:
  build-and-deploy-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Build web
        working-directory: web-dashboard-mvp
        run: |
          npm ci
          echo "VITE_API_URL=https://api.elevatedsitesolutions.com" > .env
          npm run build
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Upload to S3
        run: |
          aws s3 sync web-dashboard-mvp/dist s3://$WEB_BUCKET --delete
      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation --distribution-id $CLOUDFRONT_ID --paths "/*"
